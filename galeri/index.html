<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeri Foto — Syafaat Nuryadi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600;1,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f8f9fb;
      --surface: #ffffff;
      --surface-alt: #f1f5f9;
      --text: #0f172a;
      --text-muted: #475569;
      --text-subtle: #64748b;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --gold: #c89b3c;
      --gold-light: #e2bd6b;
      --gold-soft: #fdf8eb;
      --gold-border: rgba(200, 155, 60, 0.45);
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05), 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 12px 28px -6px rgba(15, 23, 42, 0.09), 0 4px 10px -4px rgba(15, 23, 42, 0.05);
      --shadow-lg: 0 24px 48px -12px rgba(15, 23, 42, 0.25), 0 8px 20px -6px rgba(15, 23, 42, 0.12);
      --container: 1100px;
      --header-h: 64px;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      font-size: 15px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    main {
      flex: 1 0 auto;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .container {
      width: 100%;
      max-width: var(--container);
      margin: 0 auto;
      padding: 0 20px;
    }

    .mono {
      font-family: var(--font-mono);
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* Keyframes */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes cardPopIn {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Scroll Progress Bar */
    .scroll-progress {
      position: fixed;
      top: 0;
      left: 0;
      width: 0%;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--gold-light), var(--gold));
      z-index: 250;
      transition: width 0.08s linear;
      pointer-events: none;
    }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: var(--header-h);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 12px rgba(15, 23, 42, 0.04);
      transition: box-shadow 0.25s ease, background-color 0.25s ease;
    }

    .header.is-scrolled {
      background: rgba(255, 255, 255, 0.97);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    .header-inner {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-weight: 700;
      font-size: 0.98rem;
      letter-spacing: -0.02em;
      transition: transform 0.2s ease;
    }

    .brand:hover {
      transform: translateX(2px);
    }

    .brand-mark {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
    }

    .nav-desktop {
      display: none;
      align-items: center;
      gap: 28px;
    }

    .nav-link {
      position: relative;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-muted);
      transition: color 0.2s ease;
    }

    .nav-link::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--gold));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.25s var(--ease-out);
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--accent);
      font-weight: 600;
    }

    .nav-link:hover::after,
    .nav-link.active::after {
      transform: scaleX(1);
    }

    .menu-btn {
      width: 38px;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s ease, transform 0.15s ease;
    }

    .menu-btn:active {
      transform: scale(0.94);
    }

    .menu-btn svg line {
      transition: transform 0.25s var(--ease-out), opacity 0.2s ease;
      transform-origin: center;
    }

    .menu-btn.open svg line:first-child {
      transform: translateY(4px) rotate(45deg);
    }

    .menu-btn.open svg line:last-child {
      transform: translateY(-4px) rotate(-45deg);
    }

    /* Mobile Drawer */
    .mobile-nav {
      position: fixed;
      top: var(--header-h);
      left: 0;
      right: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px 20px;
      display: flex;
      flex-direction: column;
      transform: translateY(-120%);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.3s var(--ease-out), opacity 0.25s ease;
      z-index: 99;
      box-shadow: var(--shadow-md);
    }

    .mobile-nav.open {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .mobile-nav a {
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
      font-weight: 500;
      color: var(--text);
      transition: color 0.15s ease, padding-left 0.2s ease;
    }

    .mobile-nav a:hover,
    .mobile-nav a.active {
      color: var(--accent);
      padding-left: 6px;
    }

    .mobile-nav a:last-child {
      border-bottom: none;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 22px;
      border-radius: 4px;
      font-size: 0.88rem;
      font-weight: 600;
      border: 1px solid var(--primary);
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.2s var(--ease-out), box-shadow 0.2s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(29, 78, 216, 0.22);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(29, 78, 216, 0.28);
    }

    .btn-sm {
      padding: 8px 16px;
      font-size: 0.82rem;
    }

    /* Compact Gallery Header */
    .gallery-top {
      padding: 36px 0 28px;
      background: linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
      border-bottom: 1px solid var(--border);
      animation: fadeUp 0.55s var(--ease-out) both;
    }

    .gallery-top-inner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .page-title {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.2;
    }

    .breadcrumb {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-subtle);
    }

    .breadcrumb a {
      color: var(--accent);
      transition: opacity 0.2s ease;
    }

    .breadcrumb a:hover {
      opacity: 0.75;
    }

    /* Photo Grid Section */
    .gallery-section {
      padding: 36px 0 76px;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .photo-card {
      position: relative;
      overflow: hidden;
      aspect-ratio: 4 / 3;
      background: var(--surface-alt);
      border: 1px solid var(--gold-border);
      border-top: 3px solid var(--gold);
      border-radius: 6px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.3s var(--ease-out), box-shadow 0.3s ease, border-color 0.25s ease;
      animation: cardPopIn 0.45s var(--ease-out) both;
    }

    .photo-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: -130%;
      width: 55%;
      height: 100%;
      background: linear-gradient(
        105deg,
        transparent 0%,
        rgba(226, 189, 107, 0.22) 50%,
        transparent 100%
      );
      transform: skewX(-18deg);
      transition: left 0.7s var(--ease-out);
      pointer-events: none;
      z-index: 2;
    }

    .photo-card:hover::before {
      left: 150%;
    }

    .photo-card:hover {
      transform: translateY(-4px);
      border-color: var(--gold);
      box-shadow: 0 16px 34px -6px rgba(200, 155, 60, 0.22), 0 4px 10px -4px rgba(15, 23, 42, 0.08);
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.55s var(--ease-out);
    }

    .photo-card:hover img {
      transform: scale(1.06);
    }

    .card-overlay-bar {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.25s ease, transform 0.25s var(--ease-out);
      z-index: 3;
    }

    .photo-card:hover .card-overlay-bar {
      opacity: 1;
      transform: translateY(0);
    }

    .card-date-pill {
      height: 36px;
      padding: 0 11px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(4px);
      color: var(--gold-light);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      display: inline-flex;
      align-items: center;
    }

    .card-icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(4px);
      color: #ffffff;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, transform 0.15s ease;
    }

    .card-icon-btn:hover {
      background: var(--gold);
      border-color: var(--gold);
      color: #0f172a;
      transform: scale(1.06);
    }

    /* Footer */
    .footer {
      margin-top: auto;
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 28px 0;
    }

    .footer-inner {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-start;
      justify-content: space-between;
      font-size: 0.84rem;
      color: var(--text-subtle);
    }

    .back-top {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: transform 0.2s var(--ease-out), color 0.2s ease;
    }

    .back-top:hover {
      transform: translateY(-2px);
      color: var(--gold) !important;
    }

    /* Lightbox Modal dengan Latar Foto Blur Dinamis */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      user-select: none;
      -webkit-user-select: none;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    /* Latar Belakang Mengikuti Foto Utama & Di-Blur */
    .lightbox-bg {
      position: absolute;
      inset: -48px;
      background-size: cover;
      background-position: center;
      filter: blur(28px) brightness(0.45) saturate(1.15);
      transform: scale(1.08);
      transition: background-image 0.35s ease, transform 0.35s var(--ease-out), filter 0.35s ease;
      z-index: 0;
      pointer-events: none;
    }

    .modal-backdrop.is-zoom-active .lightbox-bg {
      filter: blur(36px) brightness(0.32) saturate(1.25);
      transform: scale(1.18);
    }

    /* Top Lightbox Toolbar */
    .lightbox-topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 62px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.72) 0%, rgba(15, 23, 42, 0) 100%);
      z-index: 220;
    }

    .lightbox-status {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lightbox-badge {
      padding: 6px 11px;
      border-radius: 4px;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #ffffff;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .lightbox-badge.gold {
      color: var(--gold-light);
      border-color: var(--gold-border);
    }

    .lightbox-badge.zoom-pill {
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease;
    }

    .lightbox-badge.zoom-pill:hover {
      border-color: var(--gold);
    }

    .lightbox-tools {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lb-tool-btn {
      height: 38px;
      min-width: 38px;
      padding: 0 12px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(6px);
      color: #ffffff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease, transform 0.15s ease;
    }

    .lb-tool-btn:hover {
      background: var(--gold);
      border-color: var(--gold);
      color: #0f172a;
    }

    .lb-tool-btn:active {
      transform: scale(0.94);
    }

    .lb-tool-btn.download-btn {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .lb-tool-btn.download-btn:hover {
      background: var(--gold);
      border-color: var(--gold);
      color: #0f172a;
    }

    .lb-btn-label {
      display: none;
    }

    /* Interactive Zoom Viewport */
    .lightbox-stage {
      position: relative;
      z-index: 1;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 68px 16px 54px;
      touch-action: none;
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 6px;
      border: 1px solid var(--gold-border);
      box-shadow: var(--shadow-lg);
      background: #0f172a;
      cursor: zoom-in;
      transform-origin: center center;
      transition: transform 0.22s var(--ease-out);
      will-change: transform;
    }

    .lightbox-img.is-zoomed {
      cursor: grab;
    }

    .lightbox-img.is-dragging {
      cursor: grabbing;
      transition: none;
    }

    .lightbox-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 42px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(6px);
      color: #ffffff;
      display: grid;
      place-items: center;
      cursor: pointer;
      z-index: 215;
      transition: background 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
    }

    .lightbox-nav:hover {
      background: var(--gold);
      border-color: var(--gold);
      color: #0f172a;
    }

    .lightbox-nav.prev { left: 16px; }
    .lightbox-nav.next { right: 16px; }

    .lightbox-hint {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      padding: 5px 12px;
      border-radius: 4px;
      background: rgba(15, 23, 42, 0.68);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: rgba(255, 255, 255, 0.85);
      font-size: 0.74rem;
      white-space: nowrap;
      z-index: 215;
      pointer-events: none;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(90px) scale(0.95);
      background: var(--primary);
      color: #ffffff;
      padding: 11px 18px;
      border-radius: 4px;
      font-size: 0.84rem;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      z-index: 300;
      opacity: 0;
      pointer-events: none;
      transition: transform 0.3s var(--ease-out), opacity 0.25s ease;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0) scale(1);
      opacity: 1;
    }

    /* Responsive */
    @media (min-width: 520px) {
      .photo-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }
      .footer-inner {
        flex-direction: row;
        align-items: center;
      }
      .lb-btn-label {
        display: inline;
      }
    }

    @media (min-width: 900px) {
      .nav-desktop {
        display: flex;
      }
      .menu-btn,
      .mobile-nav {
        display: none;
      }
      .page-title {
        font-size: 2.1rem;
      }
      .photo-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 22px;
      }
    }

    @media (hover: none) {
      .card-overlay-bar {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- Scroll Progress Bar -->
  <div class="scroll-progress" id="scrollProgress"></div>

  <!-- Header -->
  <header class="header" id="siteHeader">
    <div class="container header-inner">
      <a href="../index.html#beranda" class="brand">
        <span>Syafaat Nuryadi</span>
        <span class="brand-mark">/.my.id.</span>
      </a>

      <nav class="nav-desktop">
        <a href="../index.html#keahlian" class="nav-link">Keahlian</a>
        <a href="../index.html#proyek" class="nav-link">Proyek</a>
        <a href="../index.html#pengalaman" class="nav-link">Pengalaman</a>
        <a href="./" class="nav-link active">Galeri</a>
        <a href="../index.html#kontak" class="btn btn-primary btn-sm">Kontak</a>
      </nav>

      <button class="menu-btn" id="menuBtn" aria-label="Buka menu navigasi">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <line x1="3" y1="8" x2="21" y2="8"></line>
          <line x1="3" y1="16" x2="21" y2="16"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- Mobile Navigation -->
  <nav class="mobile-nav" id="mobileNav">
    <a href="../index.html#beranda">Beranda</a>
    <a href="../index.html#keahlian">Keahlian</a>
    <a href="../index.html#proyek">Proyek</a>
    <a href="../index.html#pengalaman">Pengalaman</a>
    <a href="./" class="active">Galeri</a>
    <a href="../index.html#kontak">Kontak</a>
  </nav>

  <main>
    <!-- Header Halaman -->
    <section class="gallery-top">
      <div class="container gallery-top-inner">
        <h1 class="page-title">Galeri Foto</h1>
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="../index.html">Beranda</a>
          <span>/</span>
          <span>Galeri</span>
        </nav>
      </div>
    </section>

    <!-- Grid Foto -->
    <section class="gallery-section">
      <div class="container">
        <div class="photo-grid" id="photoGrid"></div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-inner">
      <div>&copy; <span id="year"></span> Syafaat Nuryadi.</div>
      <div style="display: flex; align-items: center; gap: 20px;">
        <a href="../index.html" class="mono back-top" style="color: var(--text-muted);">&larr; Kembali ke Beranda</a>
        <a href="#" class="mono back-top" style="color: var(--accent);">Ke atas &uarr;</a>
      </div>
    </div>
  </footer>

  <!-- Lightbox Foto dengan Latar Blur Foto Utama & Download -->
  <div class="modal-backdrop" id="lightboxModal" aria-hidden="true">
    <!-- Latar Belakang Mengikuti Foto Utama & Di-Blur -->
    <div class="lightbox-bg" id="lightboxBg" aria-hidden="true"></div>

    <!-- Toolbar Atas -->
    <div class="lightbox-topbar">
      <div class="lightbox-status">
        <span class="lightbox-badge" id="lightboxCounter">1 / 6</span>
        <span class="lightbox-badge gold" id="lightboxDate">20 Nov 2026</span>
        <span class="lightbox-badge zoom-pill" id="zoomLevel" title="Klik untuk reset zoom">100%</span>
      </div>

      <div class="lightbox-tools">
        <button class="lb-tool-btn download-btn" id="downloadBtn" title="Unduh foto" aria-label="Unduh foto">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span class="lb-btn-label">Unduh</span>
        </button>

        <button class="lb-tool-btn" id="lightboxClose" title="Tutup (Esc)" aria-label="Tutup foto">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Tombol Navigasi -->
    <button class="lightbox-nav prev" id="prevBtn" aria-label="Foto sebelumnya">&larr;</button>

    <!-- Area Foto Zoom & Pan -->
    <div class="lightbox-stage" id="lightboxStage">
      <img id="lightboxImg" class="lightbox-img" src="" alt="Foto galeri" draggable="false" />
    </div>

    <button class="lightbox-nav next" id="nextBtn" aria-label="Foto berikutnya">&rarr;</button>

    <div class="lightbox-hint" id="lightboxHint">Klik atau scroll pada foto untuk zoom</div>
  </div>

  <!-- Toast Notifikasi -->
  <div class="toast" id="toast">Mengunduh foto...</div>

  <script>
    // Daftar Foto & Tanggal (cukup tambah atau ganti URL dan tanggal di sini)
    const photos = [
      {
        src: 'https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=1400&q=85',
        date: '18 Nov 2026'
      },
      {
        src: 'https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=1400&q=85',
        date: '04 Nov 2026'
      },
      {
        src: 'https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1400&q=85',
        date: '22 Okt 2026'
      },
      {
        src: 'https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1400&q=85',
        date: '10 Okt 2026'
      },
      {
        src: 'https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=1400&q=85',
        date: '28 Sep 2026'
      },
      {
        src: 'https://sitenexs.com/assets/founder/founder.png?auto=format&fit=crop&w=1200&q=85',
        date: '15 Sep 2026'
      }
    ];

    const photoGrid = document.getElementById('photoGrid');
    const menuBtn = document.getElementById('menuBtn');
    const mobileNav = document.getElementById('mobileNav');
    const scrollProgress = document.getElementById('scrollProgress');
    const siteHeader = document.getElementById('siteHeader');
    const toast = document.getElementById('toast');

    const lightboxModal = document.getElementById('lightboxModal');
    const lightboxBg = document.getElementById('lightboxBg');
    const lightboxStage = document.getElementById('lightboxStage');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxCounter = document.getElementById('lightboxCounter');
    const lightboxDate = document.getElementById('lightboxDate');
    const lightboxHint = document.getElementById('lightboxHint');
    const zoomLevelEl = document.getElementById('zoomLevel');

    const downloadBtn = document.getElementById('downloadBtn');
    const lightboxClose = document.getElementById('lightboxClose');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    let currentIndex = 0;

    // State Zoom & Geser (Pan)
    let scale = 1;
    let panX = 0;
    let panY = 0;
    const MIN_SCALE = 1;
    const MAX_SCALE = 4;

    let isDragging = false;
    let hasMoved = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let initialPinchDist = 0;
    let initialPinchScale = 1;
    let touchUsed = false;

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), 2600);
    }

    // Fungsi Unduh Foto Langsung
    async function downloadPhoto(url, index) {
      const fileName = `galeri-syafaat-${index + 1}.jpg`;
      showToast('Menyiapkan unduhan foto...');

      try {
        const response = await fetch(url, { mode: 'cors' });
        if (!response.ok) throw new Error('Gagal mengambil file');
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);

        const link = document.createElement('a');
        link.href = blobUrl;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(blobUrl), 2000);
        showToast('Foto berhasil diunduh!');
      } catch (err) {
        const link = document.createElement('a');
        link.href = url;
        link.download = fileName;
        link.target = '_blank';
        link.rel = 'noopener';
        document.body.appendChild(link);
        link.click();
        link.remove();
        showToast('Membuka foto untuk disimpan...');
      }
    }

    // Render Grid Foto
    photoGrid.innerHTML = photos.map((item, idx) => `
      <div class="photo-card" data-index="${idx}" style="animation-delay: ${idx * 0.06}s">
        <img src="${item.src}" alt="Foto ${idx + 1}" loading="lazy" />
        <div class="card-overlay-bar">
          <span class="card-date-pill">${item.date}</span>
          <button type="button" class="card-icon-btn card-download" data-index="${idx}" title="Unduh foto" aria-label="Unduh foto ${idx + 1}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
          </button>
        </div>
      </div>
    `).join('');

    // Klik Kartu Foto atau Tombol Download di Grid
    photoGrid.addEventListener('click', (e) => {
      const dlBtn = e.target.closest('.card-download');
      if (dlBtn) {
        e.stopPropagation();
        const idx = Number(dlBtn.dataset.index);
        downloadPhoto(photos[idx].src, idx);
        return;
      }

      const card = e.target.closest('.photo-card');
      if (!card) return;
      openLightbox(Number(card.dataset.index));
    });

    // Terapkan Transform Zoom, Geser & Efek Latar Blur
    function applyTransform() {
      if (scale <= 1) {
        scale = 1;
        panX = 0;
        panY = 0;
        lightboxImg.classList.remove('is-zoomed');
        lightboxModal.classList.remove('is-zoom-active');
        lightboxHint.textContent = 'Klik atau scroll pada foto untuk zoom';
      } else {
        lightboxImg.classList.add('is-zoomed');
        lightboxModal.classList.add('is-zoom-active');
        lightboxHint.textContent = 'Geser foto untuk melihat detail • Klik foto untuk normal';
      }

      lightboxImg.style.transform = `translate3d(${panX}px, ${panY}px, 0) scale(${scale})`;
      zoomLevelEl.textContent = `${Math.round(scale * 100)}%`;
    }

    function setZoom(newScale) {
      scale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, newScale));
      applyTransform();
    }

    function resetZoom() {
      scale = 1;
      panX = 0;
      panY = 0;
      applyTransform();
    }

    // Lightbox Open / Close / Navigate
    function updateLightbox(index) {
      if (!photos.length) return;
      currentIndex = (index + photos.length) % photos.length;
      const item = photos[currentIndex];

      resetZoom();
      lightboxImg.src = item.src;
      lightboxImg.alt = `Foto ${currentIndex + 1}`;
      lightboxBg.style.backgroundImage = `url("${item.src}")`;
      lightboxCounter.textContent = `${currentIndex + 1} / ${photos.length}`;
      lightboxDate.textContent = item.date;
    }

    function openLightbox(index) {
      updateLightbox(index);
      lightboxModal.classList.add('open');
      lightboxModal.setAttribute('aria-hidden', 'false');
    }

    function closeLightbox() {
      lightboxModal.classList.remove('open');
      lightboxModal.setAttribute('aria-hidden', 'true');
      resetZoom();
    }

    zoomLevelEl.addEventListener('click', resetZoom);
    downloadBtn.addEventListener('click', () => downloadPhoto(photos[currentIndex].src, currentIndex));

    prevBtn.addEventListener('click', () => updateLightbox(currentIndex - 1));
    nextBtn.addEventListener('click', () => updateLightbox(currentIndex + 1));
    lightboxClose.addEventListener('click', closeLightbox);

    // Zoom dengan Scroll Mouse
    lightboxStage.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY < 0 ? 0.35 : -0.35;
      setZoom(scale + delta);
    }, { passive: false });

    // Drag / Geser dengan Mouse saat Zoom
    lightboxImg.addEventListener('mousedown', (e) => {
      if (touchUsed) return;
      e.preventDefault();
      isDragging = true;
      hasMoved = false;
      dragStartX = e.clientX - panX;
      dragStartY = e.clientY - panY;
      if (scale > 1) lightboxImg.classList.add('is-dragging');
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const nextX = e.clientX - dragStartX;
      const nextY = e.clientY - dragStartY;
      if (Math.abs(nextX - panX) > 3 || Math.abs(nextY - panY) > 3) {
        hasMoved = true;
      }
      if (scale > 1) {
        panX = nextX;
        panY = nextY;
        applyTransform();
      }
    });

    window.addEventListener('mouseup', () => {
      if (!isDragging) return;
      isDragging = false;
      lightboxImg.classList.remove('is-dragging');

      // Jika hanya diklik tanpa digeser, toggle zoom 100% <-> 220%
      if (!hasMoved) {
        setZoom(scale === 1 ? 2.2 : 1);
      }
    });

    // Klik area kosong di luar foto untuk menutup lightbox
    lightboxStage.addEventListener('click', (e) => {
      if (e.target === lightboxStage && scale === 1) {
        closeLightbox();
      }
    });

    // Dukungan Sentuh: Pinch-to-Zoom (2 jari), Tap Zoom & Geser / Swipe (1 jari)
    let touchStartX = 0;
    let touchMoved = false;

    function getTouchDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.hypot(dx, dy);
    }

    lightboxStage.addEventListener('touchstart', (e) => {
      touchUsed = true;
      if (e.touches.length === 2) {
        initialPinchDist = getTouchDistance(e.touches);
        initialPinchScale = scale;
        lightboxImg.classList.add('is-dragging');
      } else if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        dragStartX = e.touches[0].clientX - panX;
        dragStartY = e.touches[0].clientY - panY;
        touchMoved = false;
        if (scale > 1) lightboxImg.classList.add('is-dragging');
      }
    }, { passive: true });

    lightboxStage.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialPinchDist > 0) {
        const currentDist = getTouchDistance(e.touches);
        const ratio = currentDist / initialPinchDist;
        setZoom(initialPinchScale * ratio);
      } else if (e.touches.length === 1) {
        const dx = e.touches[0].clientX - dragStartX;
        const dy = e.touches[0].clientY - dragStartY;
        if (Math.abs(e.touches[0].clientX - touchStartX) > 6) {
          touchMoved = true;
        }
        if (scale > 1) {
          panX = dx;
          panY = dy;
          applyTransform();
        }
      }
    }, { passive: true });

    lightboxStage.addEventListener('touchend', (e) => {
      lightboxImg.classList.remove('is-dragging');
      initialPinchDist = 0;

      if (e.changedTouches.length === 1) {
        if (!touchMoved && e.target === lightboxImg) {
          setZoom(scale === 1 ? 2.2 : 1);
        } else if (scale === 1 && touchMoved) {
          const diff = e.changedTouches[0].clientX - touchStartX;
          if (Math.abs(diff) > 45) {
            updateLightbox(diff < 0 ? currentIndex + 1 : currentIndex - 1);
          }
        }
      }

      setTimeout(() => { touchUsed = false; }, 350);
    }, { passive: true });

    // Shortcut Keyboard Lightbox
    document.addEventListener('keydown', (e) => {
      if (!lightboxModal.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft' && scale === 1) updateLightbox(currentIndex - 1);
      if (e.key === 'ArrowRight' && scale === 1) updateLightbox(currentIndex + 1);
      if (e.key === '+' || e.key === '=') setZoom(scale + 0.5);
      if (e.key === '-') setZoom(scale - 0.5);
      if (e.key === '0') resetZoom();
    });

    // Toggle Menu Mobile
    menuBtn.addEventListener('click', () => {
      mobileNav.classList.toggle('open');
      menuBtn.classList.toggle('open');
    });

    mobileNav.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        mobileNav.classList.remove('open');
        menuBtn.classList.remove('open');
      });
    });

    // Scroll Progress & Header Elevation
    window.addEventListener('scroll', () => {
      const scrollTop = window.scrollY;
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
      scrollProgress.style.width = `${progress}%`;
      siteHeader.classList.toggle('is-scrolled', scrollTop > 16);
    }, { passive: true });

    // Tahun Otomatis
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
