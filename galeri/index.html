<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeri Foto — Syafaat Nuryadi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600;1,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f8f9fb;
      --surface: #ffffff;
      --surface-alt: #f1f5f9;
      --text: #0f172a;
      --text-muted: #475569;
      --text-subtle: #64748b;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --gold: #c89b3c;
      --gold-light: #e2bd6b;
      --gold-soft: #fdf8eb;
      --gold-border: rgba(200, 155, 60, 0.45);
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05), 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 12px 28px -6px rgba(15, 23, 42, 0.09), 0 4px 10px -4px rgba(15, 23, 42, 0.05);
      --shadow-lg: 0 24px 48px -12px rgba(15, 23, 42, 0.25), 0 8px 20px -6px rgba(15, 23, 42, 0.12);
      --container: 1100px;
      --header-h: 64px;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      flex-direction: column;
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
    }

    main {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .container {
      width: 100%;
      max-width: var(--container);
      margin: 0 auto;
      padding: 0 20px;
    }

    .mono {
      font-family: var(--font-mono);
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* Keyframes */
    @keyframes cardPopIn {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Scroll Progress Bar */
    .scroll-progress {
      position: fixed;
      top: 0;
      left: 0;
      width: 0%;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--gold-light), var(--gold));
      z-index: 250;
      transition: width 0.08s linear;
      pointer-events: none;
    }

    /* Header (Tetap / Tidak Ikut Scroll) */
    .header {
      position: relative;
      flex-shrink: 0;
      z-index: 100;
      height: var(--header-h);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 12px rgba(15, 23, 42, 0.04);
      transition: box-shadow 0.25s ease, background-color 0.25s ease;
    }

    .header.is-scrolled {
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    .header-inner {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-weight: 700;
      font-size: 0.98rem;
      letter-spacing: -0.02em;
      transition: transform 0.2s ease;
    }

    .brand:hover {
      transform: translateX(2px);
    }

    .brand-mark {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
    }

    .nav-desktop {
      display: none;
      align-items: center;
      gap: 28px;
    }

    .nav-link {
      position: relative;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-muted);
      transition: color 0.2s ease;
    }

    .nav-link::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--gold));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.25s var(--ease-out);
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--accent);
      font-weight: 600;
    }

    .nav-link:hover::after,
    .nav-link.active::after {
      transform: scaleX(1);
    }

    .menu-btn {
      width: 38px;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s ease, transform 0.15s ease;
    }

    .menu-btn:active {
      transform: scale(0.94);
    }

    .menu-btn svg line {
      transition: transform 0.25s var(--ease-out), opacity 0.2s ease;
      transform-origin: center;
    }

    .menu-btn.open svg line:first-child {
      transform: translateY(4px) rotate(45deg);
    }

    .menu-btn.open svg line:last-child {
      transform: translateY(-4px) rotate(-45deg);
    }

    /* Mobile Drawer */
    .mobile-nav {
      position: fixed;
      top: var(--header-h);
      left: 0;
      right: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px 20px;
      display: flex;
      flex-direction: column;
      transform: translateY(-120%);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.3s var(--ease-out), opacity 0.25s ease;
      z-index: 99;
      box-shadow: var(--shadow-md);
    }

    .mobile-nav.open {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .mobile-nav a {
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
      font-weight: 500;
      color: var(--text);
      transition: color 0.15s ease, padding-left 0.2s ease;
    }

    .mobile-nav a:hover,
    .mobile-nav a.active {
      color: var(--accent);
      padding-left: 6px;
    }

    .mobile-nav a:last-child {
      border-bottom: none;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 22px;
      border-radius: 4px;
      font-size: 0.88rem;
      font-weight: 600;
      border: 1px solid var(--primary);
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.2s var(--ease-out), box-shadow 0.2s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(29, 78, 216, 0.22);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(29, 78, 216, 0.28);
    }

    .btn-sm {
      padding: 8px 16px;
      font-size: 0.82rem;
    }

    /* Area Filter Tetap & Ringkas (Tidak Ikut Scroll) */
    .filter-dock {
      flex-shrink: 0;
      background: var(--bg);
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
      z-index: 20;
    }

    .filter-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 2px solid var(--gold);
      border-radius: 6px;
      padding: 7px 12px;
      box-shadow: var(--shadow-sm);
    }

    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .filter-status-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .filter-summary {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .filter-reset-link {
      display: none;
      background: transparent;
      border: none;
      padding: 1px 0;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent);
      cursor: pointer;
      transition: color 0.18s ease;
    }

    .filter-reset-link.visible {
      display: inline-flex;
      align-items: center;
    }

    .filter-reset-link:hover {
      color: var(--primary-hover);
      text-decoration: underline;
    }

    /* Pencarian & Filter Terbaru/Terlama Sejajar Bersebelahan */
    .filter-controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }

    .search-box {
      position: relative;
      display: inline-flex;
      align-items: center;
      height: 31px;
      width: 100%;
      max-width: 320px;
      padding: 0 9px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--bg);
      gap: 6px;
      min-width: 0;
      transition: border-color 0.18s ease, background-color 0.18s ease, box-shadow 0.18s ease;
    }

    .search-box:hover {
      border-color: var(--border-strong);
    }

    .search-box:focus-within {
      background: var(--surface);
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .search-box.has-value {
      background: var(--surface);
      border-color: var(--gold-border);
      box-shadow: 0 0 0 2px var(--gold-soft);
    }

    .search-icon {
      color: var(--text-subtle);
      flex-shrink: 0;
      transition: color 0.18s ease;
    }

    .search-box:focus-within .search-icon {
      color: var(--accent);
    }

    .search-box.has-value .search-icon {
      color: #9a6e17;
    }

    .search-input {
      width: 100%;
      min-width: 0;
      border: none;
      background: transparent;
      outline: none;
      font-size: 0.76rem;
      font-weight: 500;
      color: var(--text);
    }

    .search-input::placeholder {
      color: var(--text-subtle);
    }

    .search-clear-btn {
      width: 18px;
      height: 18px;
      border: none;
      border-radius: 3px;
      background: rgba(15, 23, 42, 0.08);
      color: var(--text);
      font-size: 0.85rem;
      line-height: 1;
      display: none;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .search-box.has-value .search-clear-btn {
      display: grid;
    }

    .search-clear-btn:hover {
      background: var(--gold);
      color: #0f172a;
    }

    /* Segmented Toggle Urutan (Terbaru | Terlama) Tepat di Samping Pencarian */
    .sort-segmented {
      display: inline-flex;
      align-items: center;
      height: 31px;
      padding: 2px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      gap: 2px;
      flex-shrink: 0;
    }

    .sort-seg-btn {
      height: 25px;
      padding: 0 9px;
      border: none;
      border-radius: 3px;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.73rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
    }

    .sort-seg-btn:hover {
      color: var(--text);
    }

    .sort-seg-btn.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
    }

    /* Area Scroll Khusus Foto (Hanya Bagian Ini yang Bisa Di-Scroll) */
    .gallery-scroll-area {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 18px 0 28px;
      scroll-behavior: smooth;
      overscroll-behavior-y: contain;
    }

    .gallery-scroll-area::-webkit-scrollbar {
      width: 7px;
    }

    .gallery-scroll-area::-webkit-scrollbar-track {
      background: transparent;
    }

    .gallery-scroll-area::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 999px;
    }

    .gallery-scroll-area::-webkit-scrollbar-thumb:hover {
      background: var(--text-subtle);
    }

    .photo-grid {
      column-count: 1;
      column-gap: 18px;
    }

    .photo-card {
      position: relative;
      display: inline-block;
      width: 100%;
      margin-bottom: 18px;
      break-inside: avoid;
      page-break-inside: avoid;
      overflow: hidden;
      background: var(--surface-alt);
      border: 1px solid var(--gold-border);
      border-top: 3px solid var(--gold);
      border-radius: 6px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.3s var(--ease-out), box-shadow 0.3s ease, border-color 0.25s ease;
      animation: cardPopIn 0.45s var(--ease-out) both;
    }

    .photo-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: -130%;
      width: 55%;
      height: 100%;
      background: linear-gradient(
        105deg,
        transparent 0%,
        rgba(226, 189, 107, 0.22) 50%,
        transparent 100%
      );
      transform: skewX(-18deg);
      transition: left 0.7s var(--ease-out);
      pointer-events: none;
      z-index: 2;
    }

    .photo-card:hover::before {
      left: 150%;
    }

    .photo-card:hover {
      transform: translateY(-4px);
      border-color: var(--gold);
      box-shadow: 0 16px 34px -6px rgba(200, 155, 60, 0.22), 0 4px 10px -4px rgba(15, 23, 42, 0.08);
    }

    .photo-card img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.55s var(--ease-out);
    }

    .photo-card:hover img {
      transform: scale(1.03);
    }

    /* Overlay Deskripsi, Tanggal & Ikon Download */
    .card-overlay {
      position: absolute;
      inset: auto 0 0 0;
      padding: 40px 14px 13px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0) 0%, rgba(15, 23, 42, 0.88) 100%);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.25s ease, transform 0.25s var(--ease-out);
      z-index: 3;
    }

    .photo-card:hover .card-overlay {
      opacity: 1;
      transform: translateY(0);
    }

    .card-meta {
      flex: 1;
      min-width: 0;
    }

    .card-date {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.69rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 3px;
    }

    .card-desc {
      font-size: 0.81rem;
      font-weight: 500;
      line-height: 1.4;
      color: #f8fafc;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Tombol Download Murni Ikon (Tanpa Kotak/Card) */
    .card-icon-btn {
      background: transparent;
      border: none;
      padding: 4px;
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
      filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.7));
      transition: color 0.2s ease, transform 0.18s var(--ease-out);
    }

    .card-icon-btn:hover {
      color: var(--gold-light);
      transform: scale(1.15);
    }

    .card-icon-btn:active {
      transform: scale(0.92);
    }

    /* Empty State saat Pencarian Tidak Ditemukan */
    .empty-state {
      display: none;
      text-align: center;
      padding: 52px 20px;
      background: var(--surface);
      border: 1px dashed var(--border-strong);
      border-radius: 6px;
    }

    .empty-state.visible {
      display: block;
    }

    .empty-state p {
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 14px;
    }

    /* Footer Ringkas & Rapi (Tetap / Tidak Ikut Scroll) */
    .footer {
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 8px 0;
      z-index: 20;
    }

    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.74rem;
      font-weight: 500;
      color: var(--text-subtle);
      letter-spacing: 0.01em;
    }

    /* Lightbox Modal dengan Latar Foto Blur Dinamis */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      user-select: none;
      -webkit-user-select: none;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    /* Latar Belakang Menampilkan Seluruh Foto Utama & Tetap Blur */
    .lightbox-bg {
      position: absolute;
      inset: 16px;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      filter: blur(28px) brightness(0.45) saturate(1.15);
      transform: scale(1);
      transition: background-image 0.35s ease, transform 0.35s var(--ease-out), filter 0.35s ease;
      z-index: 0;
      pointer-events: none;
    }

    .modal-backdrop.is-zoom-active .lightbox-bg {
      background-size: contain;
      filter: blur(24px) brightness(0.4) saturate(1.25);
      transform: scale(1);
    }

    /* Top Lightbox Toolbar */
    .lightbox-topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 62px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.72) 0%, rgba(15, 23, 42, 0) 100%);
      z-index: 220;
    }

    .lightbox-status {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lightbox-badge {
      padding: 6px 11px;
      border-radius: 4px;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #ffffff;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .lightbox-badge.gold {
      color: var(--gold-light);
      border-color: var(--gold-border);
    }

    .lightbox-badge.zoom-pill {
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease;
    }

    .lightbox-badge.zoom-pill:hover {
      border-color: var(--gold);
    }

    .lightbox-tools {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* Tombol Aksi Lightbox Murni Ikon (Tanpa Kotak/Card) */
    .lb-icon-btn {
      background: transparent;
      border: none;
      padding: 6px;
      color: rgba(255, 255, 255, 0.92);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.7));
      transition: color 0.18s ease, transform 0.18s var(--ease-out);
    }

    .lb-icon-btn:hover {
      color: var(--gold-light);
      transform: scale(1.15);
    }

    .lb-icon-btn:active {
      transform: scale(0.92);
    }

    /* Interactive Swipe & Zoom Viewport */
    .lightbox-stage {
      position: relative;
      z-index: 1;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 68px 20px 88px;
      touch-action: none;
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 6px;
      border: 1px solid var(--gold-border);
      box-shadow: var(--shadow-lg);
      background: #0f172a;
      cursor: grab;
      transform-origin: center center;
      transition: transform 0.24s var(--ease-out), opacity 0.2s ease;
      will-change: transform, opacity;
    }

    .lightbox-img.is-dragging {
      cursor: grabbing;
      transition: none;
    }

    /* Deskripsi Bawah Lightbox */
    .lightbox-bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 32px 20px 18px;
      background: linear-gradient(0deg, rgba(15, 23, 42, 0.84) 0%, rgba(15, 23, 42, 0) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      z-index: 215;
      pointer-events: none;
    }

    .lightbox-desc {
      max-width: 640px;
      font-size: 0.88rem;
      font-weight: 500;
      line-height: 1.45;
      color: #f8fafc;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.75);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(90px) scale(0.95);
      background: var(--primary);
      color: #ffffff;
      padding: 11px 18px;
      border-radius: 4px;
      font-size: 0.84rem;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      z-index: 300;
      opacity: 0;
      pointer-events: none;
      transition: transform 0.3s var(--ease-out), opacity 0.25s ease;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0) scale(1);
      opacity: 1;
    }

    /* Responsive */
    @media (max-width: 680px) {
      .filter-dock {
        padding: 7px 0;
      }
      .filter-panel {
        padding: 6px 10px;
      }
      .filter-bar {
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
      }
      .filter-status-group {
        justify-content: space-between;
      }
      .filter-controls {
        flex-direction: row;
        align-items: center;
        gap: 6px;
      }
      .search-box {
        max-width: none;
        flex: 1;
      }
      .lightbox-stage {

      }
    }

    @media (min-width: 520px) {
      .photo-grid {
        column-count: 2;
        column-gap: 20px;
      }

      }
    }

    @media (min-width: 900px) {

      .photo-grid {
        column-count: 3;

    @media (hover: none) {
      .card-overlay {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <div class="scroll-progress" id="scrollProgress"></div>

  <!-- Header (Tetap) -->
  <header class="header" id="siteHeader">

  <nav class="mobile-nav" id="mobileNav">

    <a href="../index.html#pengalaman">Pengalaman</a>
    <a href="./" class="active">Galeri</a>
    <a href="../index.html#kontak">Kontak</a>
  </nav>

  <main>
    <!-- Panel Filter Pencarian Ringkas (Tetap / Tidak Ikut Scroll) -->
    <div class="filter-dock">
      <div class="container">
        <div class="filter-panel" aria-label="Filter pencarian foto">
          <div class="filter-bar">
            <div class="filter-status-group">
              <span class="filter-summary" id="filterSummary">7 Momen</span>
              <button type="button" class="filter-reset-link" id="resetFilterLink">Reset</button>
            </div>

            <div class="filter-controls">
              <!-- Pencarian Tanggal, Bulan, Tahun, atau Deskripsi -->
              <div class="search-box" id="searchBox">
                <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input
                  type="text"
                  id="searchInput"
                  class="search-input"
                  placeholder="Cari tanggal, bulan, tahun, atau deskripsi..."
                  aria-label="Cari tanggal, bulan, tahun, atau deskripsi foto"
                  autocomplete="off"
                />
                <button
                  type="button"
                  id="clearSearchBtn"
                  class="search-clear-btn"
                  title="Hapus pencarian"
                  aria-label="Hapus pencarian"
                >&times;</button>
              </div>

              <!-- Segmented Control Urutan Tepat di Samping Pencarian -->
              <div class="sort-segmented" role="group" aria-label="Urutkan momen">
                <button type="button" class="sort-seg-btn active" data-sort="newest">Terbaru</button>
                <button type="button" class="sort-seg-btn" data-sort="oldest">Terlama</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Area Scroll Khusus Grid Foto -->
    <div class="gallery-scroll-area" id="galleryScrollArea">
      <div class="container">
        <!-- Masonry Grid Foto (Mendukung Foto Portrait Tegak & Landscape) -->
        <div class="photo-grid" id="photoGrid"></div>

        <!-- Tampilan Kosong jika Pencarian Tidak Cocok -->
        <div class="empty-state" id="emptyState">
          <p>Tidak ada foto yang cocok dengan kata kunci pencarian.</p>
          <button type="button" class="btn btn-primary btn-sm" id="emptyResetBtn">Tampilkan Semua Foto</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer Ringkas & Rapi (Tetap) -->
  <footer class="footer">
    <div class="container footer-inner">
      <span>&copy; <span id="year"></span> Syafaat Nuryadi.</span>
    </div>
  </footer>

  <!-- Lightbox Foto dengan Latar Blur Foto Utama, Geser Kiri/Kanan & Download -->
  <div class="modal-backdrop" id="lightboxModal" aria-hidden="true">
    <!-- Latar Belakang Mengikuti Seluruh Foto Utama & Di-Blur -->
    <div class="lightbox-bg" id="lightboxBg" aria-hidden="true"></div>

    <!-- Toolbar Atas -->
    <div class="lightbox-topbar">
      <div class="lightbox-status">
        <span class="lightbox-badge" id="lightboxCounter">1 / 7</span>
        <span class="lightbox-badge gold" id="lightboxDate">18 Nov 2026</span>
        <span class="lightbox-badge zoom-pill" id="zoomLevel" title="Klik untuk reset zoom">100%</span>
      </div>

      <div class="lightbox-tools">
        <button class="lb-icon-btn" id="downloadBtn" title="Unduh foto" aria-label="Unduh foto">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </button>

        <button class="lb-icon-btn" id="lightboxClose" title="Tutup (Esc)" aria-label="Tutup foto">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Area Geser (Swipe), Zoom & Pan -->
    <div class="lightbox-stage" id="lightboxStage">
      <img id="lightboxImg" class="lightbox-img" src="" alt="Foto galeri" draggable="false" />
    </div>

    <!-- Deskripsi Foto -->
    <div class="lightbox-bottom">
      <p class="lightbox-desc" id="lightboxDesc"></p>
    </div>
  </div>

  <!-- Toast Notifikasi -->
  <div class="toast" id="toast">Mengunduh foto...</div>

  <script>
    // Daftar Foto, Tanggal & Deskripsi Momen
    const photos = [
      {
        src: 'https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=1400&q=85',
        date: '18 Nov 2026',
        isoDate: '2026-11-18',
        desc: 'Tampilan antarmuka analitik dan pemantauan performa sistem berbasis web.'
      },
      {
        src: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=900&q=85',
        date: '11 Nov 2026',
        isoDate: '2026-11-11',
        desc: 'Sesi dokumentasi potret kasual dengan pencahayaan alami.'
      },
      {
        src: 'https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=1400&q=85',
        date: '04 Nov 2026',
        isoDate: '2026-11-04',
        desc: 'Eksplorasi struktur kode dan pengembangan fitur antarmuka responsif.'
      },
      {
        src: 'https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1400&q=85',
        date: '22 Okt 2026',
        isoDate: '2026-10-22',
        desc: 'Pengujian alur transaksi digital dan integrasi sistem pembayaran.'
      },
      {
        src: 'https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1400&q=85',
        date: '10 Okt 2026',
        isoDate: '2026-10-10',
        desc: 'Diskusi kolaborasi tim dalam merancang solusi produk digital.'
      },
      {
        src: 'https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=1400&q=85',
        date: '28 Sep 2026',
        isoDate: '2026-09-28',
        desc: 'Suasana ruang kerja yang tenang untuk fokus merancang desain UI.'
      },
      {
        src: 'https://sitenexs.com/assets/founder/founder.png?auto=format&fit=crop&w=1200&q=85',
        date: '15 Sep 2026',
        isoDate: '2026-09-15',
        desc: 'Potret profil founder dan pengembang utama di balik Sitenexs.'
      }
    ];

    const galleryScrollArea = document.getElementById('galleryScrollArea');
    const photoGrid = document.getElementById('photoGrid');
    const emptyState = document.getElementById('emptyState');
    const filterSummary = document.getElementById('filterSummary');
    const resetFilterLink = document.getElementById('resetFilterLink');

    const searchBox = document.getElementById('searchBox');
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const sortButtons = document.querySelectorAll('.sort-seg-btn');
    const emptyResetBtn = document.getElementById('emptyResetBtn');

    const menuBtn = document.getElementById('menuBtn');
    const mobileNav = document.getElementById('mobileNav');
    const scrollProgress = document.getElementById('scrollProgress');
    const siteHeader = document.getElementById('siteHeader');
    const toast = document.getElementById('toast');

    const lightboxModal = document.getElementById('lightboxModal');
    const lightboxBg = document.getElementById('lightboxBg');
    const lightboxStage = document.getElementById('lightboxStage');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxCounter = document.getElementById('lightboxCounter');
    const lightboxDate = document.getElementById('lightboxDate');
    const lightboxDesc = document.getElementById('lightboxDesc');
    const zoomLevelEl = document.getElementById('zoomLevel');

    const downloadBtn = document.getElementById('downloadBtn');
    const lightboxClose = document.getElementById('lightboxClose');

    // State Filter & Lightbox
    let searchQuery = '';
    let sortOrder = 'newest';
    let filteredPhotos = [...photos];
    let currentIndex = 0;

    // State Zoom, Geser (Swipe) & Pan
    let scale = 1;
    let panX = 0;
    let panY = 0;
    const MIN_SCALE = 1;
    const MAX_SCALE = 4;

    let isDragging = false;
    let hasMoved = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let swipeStartX = 0;
    let swipeOffsetX = 0;
    let initialPinchDist = 0;
    let initialPinchScale = 1;
    let touchUsed = false;
    let isTransitioningSlide = false;

    const bulanShort = ['jan', 'feb', 'mar', 'apr', 'mei', 'jun', 'jul', 'agu', 'sep', 'okt', 'nov', 'des'];
    const bulanFull = [
      'januari', 'februari', 'maret', 'april', 'mei', 'juni',
      'juli', 'agustus', 'september', 'oktober', 'november', 'desember'
    ];

    // Bangun indeks teks pencarian lengkap (tanggal, bulan singkat/lengkap, tahun, deskripsi)
    function buildSearchIndex(item) {
      const [year, monthStr, dayStr] = item.isoDate.split('-');
      const monthIdx = Number(monthStr) - 1;
      const dayNum = String(Number(dayStr));
      const mShort = bulanShort[monthIdx] || '';
      const mFull = bulanFull[monthIdx] || '';

      return [
        item.date,
        item.isoDate,
        `${dayStr}/${monthStr}/${year}`,
        `${dayStr}-${monthStr}-${year}`,
        `${dayNum} ${mShort} ${year}`,
        `${dayNum} ${mFull} ${year}`,
        `${dayStr} ${mFull} ${year}`,
        mFull,
        mShort,
        year,
        item.desc
      ].join(' ').toLowerCase();
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), 2600);
    }

    function updateScrollUI() {
      const scrollTop = galleryScrollArea.scrollTop;
      const maxScroll = galleryScrollArea.scrollHeight - galleryScrollArea.clientHeight;
      const progress = maxScroll > 0 ? (scrollTop / maxScroll) * 100 : 0;
      scrollProgress.style.width = `${progress}%`;
      siteHeader.classList.toggle('is-scrolled', scrollTop > 8);
    }

    // Terapkan Filter Pencarian Otomatis & Render Ulang Galeri
    function applyFiltersAndRender() {
      let list = [...photos];
      const keyword = searchQuery.trim().toLowerCase();

      if (keyword) {
        searchBox.classList.add('has-value');
        const tokens = keyword.split(/\s+/).filter(Boolean);
        list = list.filter(item => {
          const indexText = buildSearchIndex(item);
          return tokens.every(token => indexText.includes(token));
        });
      } else {
        searchBox.classList.remove('has-value');
      }

      list.sort((a, b) => {
        return sortOrder === 'newest'
          ? b.isoDate.localeCompare(a.isoDate)
          : a.isoDate.localeCompare(b.isoDate);
      });

      resetFilterLink.classList.toggle('visible', Boolean(keyword));
      filterSummary.textContent = keyword
        ? `${list.length} Momen ditemukan`
        : `${list.length} Momen`;

      filteredPhotos = list;

      if (!list.length) {
        photoGrid.innerHTML = '';
        emptyState.classList.add('visible');
        updateScrollUI();
        return;
      }

      emptyState.classList.remove('visible');
      photoGrid.innerHTML = list.map((item, idx) => `
        <div class="photo-card" data-index="${idx}" style="animation-delay: ${idx * 0.05}s">
          <img src="${item.src}" alt="${item.desc}" loading="lazy" />
          <div class="card-overlay">
            <div class="card-meta">
              <span class="card-date">${item.date}</span>
              <p class="card-desc">${item.desc}</p>
            </div>
            <button type="button" class="card-icon-btn card-download" data-index="${idx}" title="Unduh foto" aria-label="Unduh foto ${item.date}">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
            </button>
          </div>
        </div>
      `).join('');

      galleryScrollArea.scrollTop = 0;
      requestAnimationFrame(updateScrollUI);
    }

    // Filter Otomatis Saat Mengetik Kata Kunci
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      applyFiltersAndRender();
    });

    clearSearchBtn.addEventListener('click', () => {
      searchQuery = '';
      searchInput.value = '';
      searchInput.focus();
      applyFiltersAndRender();
    });

    // Event Segmented Control Urutan (Terbaru / Terlama)
    sortButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        sortOrder = btn.dataset.sort;
        sortButtons.forEach(b => b.classList.toggle('active', b === btn));
        applyFiltersAndRender();
      });
    });

    function resetAllFilters() {
      searchQuery = '';
      searchInput.value = '';
      sortOrder = 'newest';
      sortButtons.forEach(b => b.classList.toggle('active', b.dataset.sort === 'newest'));
      applyFiltersAndRender();
    }

    resetFilterLink.addEventListener('click', resetAllFilters);
    emptyResetBtn.addEventListener('click', resetAllFilters);

    // Fungsi Unduh Foto Langsung
    async function downloadPhoto(item, index) {
      const fileName = `galeri-syafaat-${item.isoDate || index + 1}.jpg`;
      showToast('Menyiapkan unduhan foto...');

      try {
        const response = await fetch(item.src, { mode: 'cors' });
        if (!response.ok) throw new Error('Gagal mengambil file');
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);

        const link = document.createElement('a');
        link.href = blobUrl;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(blobUrl), 2000);
        showToast('Foto berhasil diunduh!');
      } catch (err) {
        const link = document.createElement('a');
        link.href = item.src;
        link.download = fileName;
        link.target = '_blank';
        link.rel = 'noopener';
        document.body.appendChild(link);
        link.click();
        link.remove();
        showToast('Membuka foto untuk disimpan...');
      }
    }

    // Klik Kartu Foto atau Tombol Download di Grid
    photoGrid.addEventListener('click', (e) => {
      const dlBtn = e.target.closest('.card-download');
      if (dlBtn) {
        e.stopPropagation();
        const idx = Number(dlBtn.dataset.index);
        downloadPhoto(filteredPhotos[idx], idx);
        return;
      }

      const card = e.target.closest('.photo-card');
      if (!card) return;
      openLightbox(Number(card.dataset.index));
    });

    // Terapkan Transform Zoom, Geser & Efek Latar Blur
    function applyTransform() {
      if (scale <= 1) {
        scale = 1;
        panX = 0;
        panY = 0;
        lightboxModal.classList.remove('is-zoom-active');
      } else {
        lightboxModal.classList.add('is-zoom-active');
      }

      lightboxImg.style.transform = `translate3d(${panX}px, ${panY}px, 0) scale(${scale})`;
      lightboxImg.style.opacity = '1';
      zoomLevelEl.textContent = `${Math.round(scale * 100)}%`;
    }

    function setZoom(newScale) {
      scale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, newScale));
      applyTransform();
    }

    function resetZoom() {
      scale = 1;
      panX = 0;
      panY = 0;
      swipeOffsetX = 0;
      applyTransform();
    }

    // Lightbox Open / Close / Navigate (Mengikuti Hasil Filter Aktif)
    function updateLightbox(index) {
      if (!filteredPhotos.length) return;
      currentIndex = (index + filteredPhotos.length) % filteredPhotos.length;
      const item = filteredPhotos[currentIndex];

      resetZoom();
      lightboxImg.src = item.src;
      lightboxImg.alt = item.desc;
      lightboxBg.style.backgroundImage = `url("${item.src}")`;
      lightboxCounter.textContent = `${currentIndex + 1} / ${filteredPhotos.length}`;
      lightboxDate.textContent = item.date;
      lightboxDesc.textContent = item.desc;
    }

    // Perpindahan Foto Halus Saat Digeser ke Kiri (direction = 1) atau Kanan (direction = -1)
    function switchSlide(direction) {
      if (filteredPhotos.length <= 1) {
        resetZoom();
        return;
      }
      if (isTransitioningSlide) return;
      isTransitioningSlide = true;

      lightboxImg.classList.remove('is-dragging');
      lightboxImg.style.transform = `translate3d(${direction * -90}px, 0, 0) scale(0.97)`;
      lightboxImg.style.opacity = '0';

      setTimeout(() => {
        currentIndex = (currentIndex + direction + filteredPhotos.length) % filteredPhotos.length;
        const item = filteredPhotos[currentIndex];

        scale = 1;
        panX = 0;
        panY = 0;
        swipeOffsetX = 0;
        lightboxModal.classList.remove('is-zoom-active');
        zoomLevelEl.textContent = '100%';

        lightboxImg.classList.add('is-dragging');
        lightboxImg.src = item.src;
        lightboxImg.alt = item.desc;
        lightboxBg.style.backgroundImage = `url("${item.src}")`;
        lightboxCounter.textContent = `${currentIndex + 1} / ${filteredPhotos.length}`;
        lightboxDate.textContent = item.date;
        lightboxDesc.textContent = item.desc;

        lightboxImg.style.transform = `translate3d(${direction * 70}px, 0, 0) scale(0.98)`;
        lightboxImg.style.opacity = '0';

        void lightboxImg.offsetWidth;

        lightboxImg.classList.remove('is-dragging');
        lightboxImg.style.transform = 'translate3d(0, 0, 0) scale(1)';
        lightboxImg.style.opacity = '1';

        setTimeout(() => {
          isTransitioningSlide = false;
        }, 240);
      }, 140);
    }

    function openLightbox(index) {
      updateLightbox(index);
      lightboxModal.classList.add('open');
      lightboxModal.setAttribute('aria-hidden', 'false');
    }

    function closeLightbox() {
      lightboxModal.classList.remove('open');
      lightboxModal.setAttribute('aria-hidden', 'true');
      resetZoom();
    }

    zoomLevelEl.addEventListener('click', resetZoom);
    downloadBtn.addEventListener('click', () => downloadPhoto(filteredPhotos[currentIndex], currentIndex));
    lightboxClose.addEventListener('click', closeLightbox);

    // Zoom dengan Scroll Mouse
    lightboxStage.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY < 0 ? 0.35 : -0.35;
      setZoom(scale + delta);
    }, { passive: false });

    // Geser (Swipe) & Drag dengan Mouse (Desktop)
    lightboxStage.addEventListener('mousedown', (e) => {
      if (touchUsed || e.button !== 0 || isTransitioningSlide) return;
      e.preventDefault();
      isDragging = true;
      hasMoved = false;
      swipeStartX = e.clientX;
      swipeOffsetX = 0;
      dragStartX = e.clientX - panX;
      dragStartY = e.clientY - panY;
      lightboxImg.classList.add('is-dragging');
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - swipeStartX;
      const nextPanX = e.clientX - dragStartX;
      const nextPanY = e.clientY - dragStartY;

      if (Math.abs(dx) > 5 || (scale > 1 && (Math.abs(nextPanX - panX) > 4 || Math.abs(nextPanY - panY) > 4))) {
        hasMoved = true;
      }

      if (scale > 1) {
        panX = nextPanX;
        panY = nextPanY;
        applyTransform();
      } else if (hasMoved) {
        const resistance = filteredPhotos.length <= 1 ? 0.25 : 1;
        swipeOffsetX = dx * resistance;
        lightboxImg.style.transform = `translate3d(${swipeOffsetX}px, 0, 0) scale(1)`;
        lightboxImg.style.opacity = `${Math.max(0.45, 1 - Math.abs(swipeOffsetX) / 420)}`;
      }
    });

    window.addEventListener('mouseup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      lightboxImg.classList.remove('is-dragging');

      if (!hasMoved) {
        if (e.target === lightboxImg) {
          setZoom(scale === 1 ? 2.2 : 1);
        } else if (e.target === lightboxStage && scale === 1) {
          closeLightbox();
        }
        return;
      }

      if (scale === 1) {
        if (Math.abs(swipeOffsetX) > 55 && filteredPhotos.length > 1) {
          switchSlide(swipeOffsetX < 0 ? 1 : -1);
        } else {
          resetZoom();
        }
      }
    });

    // Dukungan Sentuh: Pinch-to-Zoom (2 jari), Tap Zoom & Geser Kiri/Kanan (1 jari)
    let touchStartX = 0;
    let touchStartY = 0;
    let touchMoved = false;
    let touchTarget = null;

    function getTouchDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.hypot(dx, dy);
    }

    lightboxStage.addEventListener('touchstart', (e) => {
      if (isTransitioningSlide) return;
      touchUsed = true;
      touchTarget = e.target;

      if (e.touches.length === 2) {
        initialPinchDist = getTouchDistance(e.touches);
        initialPinchScale = scale;
        lightboxImg.classList.add('is-dragging');
      } else if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        dragStartX = e.touches[0].clientX - panX;
        dragStartY = e.touches[0].clientY - panY;
        touchMoved = false;
        swipeOffsetX = 0;
        lightboxImg.classList.add('is-dragging');
      }
    }, { passive: true });

    lightboxStage.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialPinchDist > 0) {
        const currentDist = getTouchDistance(e.touches);
        const ratio = currentDist / initialPinchDist;
        setZoom(initialPinchScale * ratio);
      } else if (e.touches.length === 1) {
        const dx = e.touches[0].clientX - touchStartX;
        const dy = e.touches[0].clientY - touchStartY;

        if (Math.abs(dx) > 6 || Math.abs(dy) > 6) {
          touchMoved = true;
        }

        if (scale > 1) {
          panX = e.touches[0].clientX - dragStartX;
          panY = e.touches[0].clientY - dragStartY;
          applyTransform();
        } else if (touchMoved && Math.abs(dx) >= Math.abs(dy)) {
          const resistance = filteredPhotos.length <= 1 ? 0.25 : 1;
          swipeOffsetX = dx * resistance;
          lightboxImg.style.transform = `translate3d(${swipeOffsetX}px, 0, 0) scale(1)`;
          lightboxImg.style.opacity = `${Math.max(0.45, 1 - Math.abs(swipeOffsetX) / 360)}`;
        }
      }
    }, { passive: true });

    lightboxStage.addEventListener('touchend', (e) => {
      lightboxImg.classList.remove('is-dragging');
      initialPinchDist = 0;

      if (e.changedTouches.length === 1) {
        if (!touchMoved) {
          if (touchTarget === lightboxImg) {
            setZoom(scale === 1 ? 2.2 : 1);
          } else if (touchTarget === lightboxStage && scale === 1) {
            closeLightbox();
          }
        } else if (scale === 1) {
          if (Math.abs(swipeOffsetX) > 45 && filteredPhotos.length > 1) {
            switchSlide(swipeOffsetX < 0 ? 1 : -1);
          } else {
            resetZoom();
          }
        }
      }

      setTimeout(() => { touchUsed = false; }, 350);
    }, { passive: true });

    // Shortcut Keyboard Lightbox
    document.addEventListener('keydown', (e) => {
      if (!lightboxModal.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft' && scale === 1) switchSlide(-1);
      if (e.key === 'ArrowRight' && scale === 1) switchSlide(1);
      if (e.key === '+' || e.key === '=') setZoom(scale + 0.5);
      if (e.key === '-') setZoom(scale - 0.5);
      if (e.key === '0') resetZoom();
    });

    // Toggle Menu Mobile
    menuBtn.addEventListener('click', () => {
      mobileNav.classList.toggle('open');
      menuBtn.classList.toggle('open');
    });

    mobileNav.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        mobileNav.classList.remove('open');
        menuBtn.classList.remove('open');
      });
    });

    // Scroll Progress Khusus Area Foto
    galleryScrollArea.addEventListener('scroll', updateScrollUI, { passive: true });
    window.addEventListener('resize', updateScrollUI, { passive: true });

    // Inisialisasi Awal
    document.getElementById('year').textContent = new Date().getFullYear();
    applyFiltersAndRender();
  </script>
</body>
</html>
